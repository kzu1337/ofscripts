    const nav = document.getElementById("nav");

    const empty = document.getElementById("empty");
    const toast = document.getElementById("toast");
    const searchInput = document.getElementById("search");

    function buildNav() {
      nav.innerHTML = "";
      const allBtn = document.createElement("button");
      allBtn.className = "nav-btn" + (currentCategory === "All" ? " active" : "");
      allBtn.innerHTML = `Toate <span class="count">(${Object.values(DATA).flat().length})</span>`;
      allBtn.onclick = () => setCategory("All");
      nav.appendChild(allBtn);

      Object.keys(DATA).forEach(cat => {
        const btn = document.createElement("button");
        btn.className = "nav-btn" + (currentCategory === cat ? " active" : "");
        btn.innerHTML = `${cat} <span class="count">(${DATA[cat].length})</span>`;
        btn.onclick = () => setCategory(cat);
        nav.appendChild(btn);
      });
    }

    function setCategory(cat) {
      currentCategory = cat;
      buildNav();
      render();
    }

    function getFiltered() {
      let items = [];
      if (currentCategory === "All") {
        Object.entries(DATA).forEach(([cat, msgs]) => {
          msgs.forEach(m => items.push({ cat, text: m }));
        });
      } else {
        DATA[currentCategory].forEach(m => items.push({ cat: currentCategory, text: m }));
      }
      if (searchQuery) {
        const q = searchQuery.toLowerCase();
        items = items.filter(i => i.text.toLowerCase().includes(q) || i.cat.toLowerCase().includes(q));
      }
      return items;
    }

    function render() {
      const items = getFiltered();
      grid.innerHTML = "";
      empty.style.display = items.length ? "none" : "block";
      const label = currentCategory === "All" ? "Toate" : currentCategory;
      title.innerHTML = `${label} <span class="badge">${items.length}</span>`;
      items.forEach(({ text }) => {
        const card = document.createElement("div");
        card.className = "script-card";
        const textEl = document.createElement("div");
        textEl.className = "script-text";
        textEl.textContent = text;
        const btn = document.createElement("button");
        btn.className = "copy-btn";
        btn.innerHTML = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg> Copy`;
        btn.onclick = () => copyText(text, btn);
        card.appendChild(textEl);
        card.appendChild(btn);
        grid.appendChild(card);
      });
    }

    function copyText(text, btn) {
      navigator.clipboard.writeText(text).then(() => {
        btn.classList.add("copied");
        btn.innerHTML = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg> Copiat`;
        showToast("Mesaj copiat!");
        setTimeout(() => {
          btn.classList.remove("copied");
          btn.innerHTML = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg> Copy`;
        }, 1800);
      }).catch(() => {
        const ta = document.createElement("textarea");
        ta.value = text;
        document.body.appendChild(ta);
        ta.select();
        document.execCommand("copy");
        document.body.removeChild(ta);
        showToast("Mesaj copiat!");
      });
    }

    function showToast(msg) {
      toast.textContent = msg;
      toast.classList.add("show", "success");
      setTimeout(() => toast.classList.remove("show"), 2000);
    }

    });

    buildNav();
    render();
